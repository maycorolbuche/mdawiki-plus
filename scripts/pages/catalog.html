<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Páginas do MDAWiki Plus</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #333;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 25px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 2px 4px rgba(0, 0, 0, .03),
                0 8px 24px rgba(0, 0, 0, .04);

            transition: all .2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 4px 8px rgba(0, 0, 0, .05),
                0 12px 28px rgba(0, 0, 0, .08);
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .title a {
            color: #111827;
            text-decoration: none;
        }

        .title a:hover {
            color: #2563eb;
        }

        .desc {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
        }

        .reference {
            margin-top: 12px;
            font-size: 13px;
        }

        .reference a {
            color: #2563eb;
            text-decoration: none;
        }

        .reference a:hover {
            text-decoration: underline;
        }

        .thumb {
            flex-shrink: 0;
            font-size: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .thumb img {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            display: block;
            background: #fff;
        }

        @media (max-width: 700px) {

            .card {
                flex-direction: column-reverse;
                align-items: flex-start;
            }

            .thumb img {
                width: 100%;
                height: auto;
                max-height: 220px;
            }
        }
    </style>
</head>
<body>
    <h1>Páginas do MDAWiki Plus ({{count}})</h1>
    <div class="cards">
        {{cards}}
    </div>
</body>
</html>
